<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dd92"/>
      <stop offset=".45" stop-color="#d3a748"/>
      <stop offset="1" stop-color="#9a6f26"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <circle cx="50" cy="50" r="48" fill="#fff"/>
      <ellipse cx="50" cy="50" rx="40" ry="25" transform="rotate(35 50 50)" fill="#000"/>
    </mask>
    <clipPath id="h">
      <rect x="-60" y="-60" width="120" height="60" transform="translate(50 50) rotate(35)"/>
    </clipPath>
    <g id="r">
      <circle cx="50" cy="50" r="48" fill="#111" mask="url(#m)"/>
      <circle cx="50" cy="50" r="48" fill="url(#g)" mask="url(#m)" clip-path="url(#h)"/>
    </g>
  </defs>
  <use href="#r"/>
  <use href="#r" transform="translate(196 0) scale(-1 1)"/>
</svg>
